<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dayflow — HRMS Preview</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background:#FBF6EF; color:#2E1F17; }
  .font-display { font-family: 'Fraunces', serif; }
  .bg-grain { background-image: radial-gradient(rgba(46,31,23,0.035) 1px, transparent 1px); background-size: 14px 14px; }
  .btn-pop { transition: transform .15s ease, box-shadow .15s ease; }
  .btn-pop:hover { transform: translateY(-2px); }
  .btn-pop:active { transform: translateY(0) scale(.98); }
  .card-pop { transition: transform .2s ease, box-shadow .2s ease; }
  .card-pop:hover { transform: translateY(-3px); }
  .shadow-pop { box-shadow: 0 1px 2px rgba(46,31,23,.08), 0 8px 20px -6px rgba(46,31,23,.18); }
  .shadow-popHover { box-shadow: 0 4px 10px rgba(46,31,23,.12), 0 16px 32px -8px rgba(46,31,23,.28); }
  .shadow-inset3d { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 14px -4px rgba(46,31,23,.35); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---- theme colors as inline classes since Tailwind CDN doesn't know custom "coffee" tokens ---- */
const coffee = {
  50: "#FBF6EF", 100:"#F3E9DD", 200:"#E6D3BC", 300:"#D3B28C",
  400:"#B98D5F", 500:"#8C5E3C", 600:"#6F4E37", 700:"#5A3D2B", 800:"#432D20", 900:"#2E1F17"
};

/* ---------------- DATA (in-memory, resets on refresh — this is just a preview) ---------------- */
const seedUsers = [
  { empId: "EMP000", name: "HR Admin", email: "admin@dayflow.com", password: "admin123", role: "Admin" },
  { empId: "EMP001", name: "Aditi Rao", email: "aditi@dayflow.com", password: "emp123", role: "Employee" },
];
const seedEmployees = [
  { id: "EMP001", name: "Aditi Rao", email: "aditi@dayflow.com", designation: "UI Designer", dept: "Product", phone: "9876543210", address: "Coimbatore, TN", salary: 52000, joined: "2023-03-14" },
  { id: "EMP002", name: "Karthik Menon", email: "karthik@dayflow.com", designation: "Backend Dev", dept: "Engineering", phone: "9876501234", address: "Chennai, TN", salary: 68000, joined: "2022-11-02" },
  { id: "EMP003", name: "Priya Sharma", email: "priya@dayflow.com", designation: "HR Executive", dept: "People Ops", phone: "9876511111", address: "Bengaluru, KA", salary: 45000, joined: "2024-01-20" },
];
const seedAttendance = [
  { id: 1, empId: "EMP001", date: "2026-08-18", status: "Present", checkIn: "09:02", checkOut: "18:05" },
  { id: 2, empId: "EMP001", date: "2026-08-19", status: "Present", checkIn: "09:10", checkOut: "18:00" },
  { id: 3, empId: "EMP001", date: "2026-08-20", status: "Half-day", checkIn: "09:05", checkOut: "13:30" },
  { id: 4, empId: "EMP001", date: "2026-08-21", status: "Absent", checkIn: "-", checkOut: "-" },
  { id: 5, empId: "EMP002", date: "2026-08-21", status: "Present", checkIn: "09:00", checkOut: "18:10" },
  { id: 6, empId: "EMP003", date: "2026-08-21", status: "Leave", checkIn: "-", checkOut: "-" },
];
const seedLeaves = [
  { id: 1, empId: "EMP001", name: "Aditi Rao", type: "Sick", from: "2026-08-25", to: "2026-08-26", remarks: "Fever", status: "Pending" },
  { id: 2, empId: "EMP002", name: "Karthik Menon", type: "Paid", from: "2026-08-30", to: "2026-09-02", remarks: "Family trip", status: "Approved" },
  { id: 3, empId: "EMP003", name: "Priya Sharma", type: "Unpaid", from: "2026-09-05", to: "2026-09-05", remarks: "Personal work", status: "Rejected" },
];

const STATUS_COLOR = {
  Present: "bg-emerald-100 text-emerald-700", Approved: "bg-emerald-100 text-emerald-700",
  Absent: "bg-rose-100 text-rose-700", Rejected: "bg-rose-100 text-rose-700",
  "Half-day": "bg-amber-100 text-amber-700", Pending: "bg-amber-100 text-amber-700",
  Leave: "bg-sky-100 text-sky-700",
};

/* ---------------- UI COMPONENTS ---------------- */
const Badge = ({ status }) => <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${STATUS_COLOR[status] || "bg-stone-100 text-stone-700"}`}>{status}</span>;

const Card = ({ children, className = "", pop = true }) => (
  <div className={`bg-white rounded-2xl border shadow-pop ${pop ? "card-pop hover:shadow-popHover" : ""} ${className}`} style={{borderColor: coffee[100]}}>{children}</div>
);

const Button = ({ children, onClick, variant = "primary", type = "button", className = "" }) => {
  const base = "btn-pop px-4 py-2.5 rounded-xl text-sm font-semibold";
  const styleMap = {
    primary: { background: coffee[700], color: "#fff" },
    ghost: { background: "transparent", color: coffee[700], border: `1px solid ${coffee[300]}` },
    danger: { background: "#e11d48", color: "#fff" },
    success: { background: "#059669", color: "#fff" },
  };
  return <button type={type} onClick={onClick} className={`${base} shadow-inset3d ${className}`} style={styleMap[variant]}>{children}</button>;
};

const Input = (props) => <input {...props} className={`w-full border rounded-xl px-3 py-2.5 text-sm outline-none bg-white transition ${props.className||""}`} style={{borderColor: coffee[200]}} />;

const Select = ({ options, ...props }) => (
  <select {...props} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none bg-white transition" style={{borderColor: coffee[200]}}>
    {options.map(o => <option key={o} value={o}>{o}</option>)}
  </select>
);

const Avatar = ({ name, size = 12 }) => {
  const initials = name.split(" ").map(n=>n[0]).join("").slice(0,2);
  return <div style={{width:size*4, height:size*4, background:`linear-gradient(135deg, ${coffee[400]}, ${coffee[700]})`}} className="rounded-full text-white flex items-center justify-center font-display font-bold shadow-inset3d">{initials}</div>;
};

const Logo = () => (
  <div className="flex items-center gap-2.5">
    <div style={{background:`linear-gradient(135deg, ${coffee[500]}, ${coffee[800]})`}} className="w-9 h-9 rounded-xl shadow-inset3d flex items-center justify-center text-white font-display font-bold text-lg">D</div>
    <span className="font-display font-bold text-xl" style={{color: coffee[800]}}>Dayflow</span>
  </div>
);

const SectionTitle = ({ title, desc }) => (
  <div className="mb-6">
    <h1 className="font-display text-2xl md:text-3xl font-bold" style={{color: coffee[900]}}>{title}</h1>
    {desc && <p className="text-sm mt-1.5" style={{color: coffee[500]}}>{desc}</p>}
  </div>
);

/* ---------------- AUTH ---------------- */
function AuthLayout({ children, subtitle }) {
  return (
    <div className="min-h-screen flex items-center justify-center px-4 bg-grain relative overflow-hidden">
      <div className="absolute -top-24 -left-24 w-72 h-72 rounded-full blur-3xl" style={{background: coffee[200]+"66"}} />
      <div className="absolute -bottom-24 -right-24 w-80 h-80 rounded-full blur-3xl" style={{background: coffee[300]+"55"}} />
      <div className="w-full max-w-md relative">
        <div className="flex flex-col items-center mb-7">
          <Logo />
          <p className="text-sm mt-2.5" style={{color: coffee[500]}}>{subtitle}</p>
        </div>
        <Card className="p-7" pop={false}>{children}</Card>
      </div>
    </div>
  );
}

function SignIn({ users, onLogin, goSignUp }) {
  const [email, setEmail] = useState(""); const [password, setPassword] = useState(""); const [error, setError] = useState("");
  const submit = (e) => {
    e.preventDefault();
    const found = users.find(u => u.email.toLowerCase() === email.trim().toLowerCase() && u.password === password);
    if (found) { setError(""); onLogin(found); } else setError("Incorrect email or password.");
  };
  return (
    <AuthLayout subtitle="Sign in to your workday">
      <form onSubmit={submit} className="space-y-4">
        <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Email</label><Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@dayflow.com" required /></div>
        <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Password</label><Input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required /></div>
        {error && <p className="text-rose-600 text-sm">{error}</p>}
        <Button type="submit" className="w-full">Sign In</Button>
        <div className="text-xs rounded-xl p-3 leading-relaxed" style={{color:coffee[500], background:coffee[50]}}>
          Demo — Admin: admin@dayflow.com / admin123 &nbsp;|&nbsp; Employee: aditi@dayflow.com / emp123. Or sign up below with any details.
        </div>
        <p className="text-sm text-center" style={{color:coffee[500]}}>No account? <button type="button" onClick={goSignUp} className="font-semibold" style={{color:coffee[800]}}>Sign Up</button></p>
      </form>
    </AuthLayout>
  );
}

function SignUp({ users, onRegister, goSignIn }) {
  const [empId,setEmpId]=useState(""); const [name,setName]=useState(""); const [email,setEmail]=useState("");
  const [password,setPassword]=useState(""); const [role,setRole]=useState("Employee"); const [error,setError]=useState(""); const [done,setDone]=useState(false);
  const submit = (e) => {
    e.preventDefault();
    if (users.some(u=>u.email.toLowerCase()===email.trim().toLowerCase())) { setError("An account with this email already exists."); return; }
    if (password.length < 8) { setError("Password must be at least 8 characters."); return; }
    onRegister({ empId: empId || `EMP${Date.now().toString().slice(-4)}`, name, email, password, role });
    setDone(true);
  };
  return (
    <AuthLayout subtitle="Create your account">
      {done ? (
        <div className="text-center py-4">
          <p className="text-emerald-600 font-semibold mb-2">Account created!</p>
          <p className="text-sm mb-4" style={{color:coffee[500]}}>You can now sign in with your email and password.</p>
          <Button onClick={goSignIn} className="w-full">Go to Sign In</Button>
        </div>
      ) : (
        <form onSubmit={submit} className="space-y-4">
          <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Employee ID</label><Input value={empId} onChange={e=>setEmpId(e.target.value)} placeholder="EMP004" /></div>
          <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Full Name</label><Input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" required /></div>
          <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Email</label><Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@dayflow.com" required /></div>
          <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Password</label><Input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Min 8 characters" required minLength={8} /></div>
          <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Role</label><Select options={["Employee","Admin"]} value={role} onChange={e=>setRole(e.target.value)} /></div>
          {error && <p className="text-rose-600 text-sm">{error}</p>}
          <Button type="submit" className="w-full">Sign Up</Button>
          <p className="text-sm text-center" style={{color:coffee[500]}}>Already have an account? <button type="button" onClick={goSignIn} className="font-semibold" style={{color:coffee[800]}}>Sign In</button></p>
        </form>
      )}
    </AuthLayout>
  );
}

/* ---------------- SHELL ---------------- */
function Shell({ user, onLogout, active, setActive, tabs, children }) {
  return (
    <div className="min-h-screen flex">
      <aside className="w-64 text-white flex flex-col shrink-0 shadow-popHover" style={{background:`linear-gradient(180deg, ${coffee[800]}, ${coffee[900]})`}}>
        <div className="p-5 border-b border-white/10">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-white/15 shadow-inset3d flex items-center justify-center font-display font-bold text-lg">D</div>
            <span className="font-display font-bold text-xl">Dayflow</span>
          </div>
        </div>
        <nav className="flex-1 p-3 space-y-1.5 mt-2">
          {tabs.map(t => (
            <button key={t.key} onClick={()=>setActive(t.key)} className="btn-pop w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-medium"
              style={active===t.key ? {background:coffee[50], color:coffee[800]} : {color:"rgba(255,255,255,.75)"}}>
              {t.label}
            </button>
          ))}
        </nav>
        <div className="p-3 border-t border-white/10">
          <div className="flex items-center gap-2.5 px-2 py-2">
            <Avatar name={user.name} size={8} />
            <div className="leading-tight"><p className="text-sm font-semibold">{user.name}</p><p className="text-xs text-white/50">{user.role}</p></div>
          </div>
          <button onClick={onLogout} className="btn-pop w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-medium text-white/75 hover:bg-white/10 mt-1">Logout</button>
        </div>
      </aside>
      <main className="flex-1 p-8 overflow-y-auto bg-grain">{children}</main>
    </div>
  );
}

/* ---------------- EMPLOYEE PAGES ---------------- */
function EmployeeDashboard({ user, setActive, myLeaves }) {
  const cards = [
    { key:"profile", label:"Profile", hint:"View & edit your details" },
    { key:"attendance", label:"Attendance", hint:"Check in / check out" },
    { key:"leave", label:"Leave Requests", hint:"Apply & track status" },
    { key:"payroll", label:"Payroll", hint:"View salary details" },
  ];
  const pendingLeave = myLeaves.find(l=>l.status==="Pending");
  return (
    <div>
      <SectionTitle title={`Welcome, ${user.name.split(" ")[0]}`} desc="Here's your workday at a glance." />
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        {cards.map(c => (
          <button key={c.key} onClick={()=>setActive(c.key)} className="text-left">
            <Card className="p-5 h-full"><p className="font-display font-bold text-lg" style={{color:coffee[900]}}>{c.label}</p><p className="text-xs mt-1" style={{color:coffee[500]}}>{c.hint}</p></Card>
          </button>
        ))}
      </div>
      <Card className="p-5" pop={false}>
        <p className="font-semibold mb-2" style={{color:coffee[800]}}>Recent Activity</p>
        <ul className="text-sm space-y-2" style={{color:coffee[500]}}>
          {pendingLeave ? <li>• Your {pendingLeave.type} leave request is pending approval.</li> : <li>• No pending leave requests.</li>}
          <li>• Keep your attendance updated by checking in daily.</li>
        </ul>
      </Card>
    </div>
  );
}

function ProfilePage({ employee, updateEmployee }) {
  const [edit,setEdit]=useState(false); const [form,setForm]=useState(employee);
  const save = () => { updateEmployee(form); setEdit(false); };
  return (
    <div>
      <SectionTitle title="My Profile" desc="View your details. You can edit address, phone, and photo." />
      <Card className="p-6 max-w-2xl" pop={false}>
        <div className="flex items-center gap-4 mb-6">
          <Avatar name={form.name} size={16} />
          <div><p className="font-display font-bold text-lg" style={{color:coffee[900]}}>{form.name}</p><p className="text-sm" style={{color:coffee[500]}}>{form.designation} · {form.dept}</p></div>
        </div>
        <div className="grid grid-cols-2 gap-5 text-sm">
          <div><p className="text-xs mb-1" style={{color:coffee[400]}}>Employee ID</p><p style={{color:coffee[800]}}>{form.id}</p></div>
          <div><p className="text-xs mb-1" style={{color:coffee[400]}}>Email</p><p style={{color:coffee[800]}}>{form.email}</p></div>
          <div><p className="text-xs mb-1" style={{color:coffee[400]}}>Phone</p>{edit ? <Input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} /> : <p style={{color:coffee[800]}}>{form.phone}</p>}</div>
          <div><p className="text-xs mb-1" style={{color:coffee[400]}}>Address</p>{edit ? <Input value={form.address} onChange={e=>setForm({...form,address:e.target.value})} /> : <p style={{color:coffee[800]}}>{form.address}</p>}</div>
          <div><p className="text-xs mb-1" style={{color:coffee[400]}}>Joined</p><p style={{color:coffee[800]}}>{form.joined}</p></div>
          <div><p className="text-xs mb-1" style={{color:coffee[400]}}>Salary (read-only)</p><p style={{color:coffee[800]}}>₹{form.salary.toLocaleString()}</p></div>
        </div>
        <div className="mt-6">
          {edit ? <div className="flex gap-2"><Button onClick={save} variant="success">Save Changes</Button><Button onClick={()=>{setForm(employee);setEdit(false);}} variant="ghost">Cancel</Button></div>
          : <Button onClick={()=>setEdit(true)} variant="ghost">Edit Profile</Button>}
        </div>
      </Card>
    </div>
  );
}

function AttendancePage({ empId, attendance, addAttendance }) {
  const [view,setView]=useState("weekly"); const [checkedIn,setCheckedIn]=useState(false);
  const mine = attendance.filter(a=>a.empId===empId);
  const doCheckIn = () => {
    const now = new Date();
    addAttendance({ id: Date.now(), empId, date: now.toISOString().slice(0,10), status:"Present", checkIn: now.toTimeString().slice(0,5), checkOut:"-" });
    setCheckedIn(true);
  };
  return (
    <div>
      <SectionTitle title="My Attendance" desc="Track your daily check-ins and view your history." />
      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-2">
          <Button variant={view==="daily"?"primary":"ghost"} onClick={()=>setView("daily")}>Daily</Button>
          <Button variant={view==="weekly"?"primary":"ghost"} onClick={()=>setView("weekly")}>Weekly</Button>
        </div>
        <Button onClick={doCheckIn} variant={checkedIn?"ghost":"success"}>{checkedIn?"Checked In ✓":"Check In"}</Button>
      </div>
      <Card className="p-0 overflow-hidden" pop={false}>
        <table className="w-full text-sm">
          <thead style={{background:coffee[50], color:coffee[500]}} className="text-left"><tr><th className="p-3">Date</th><th className="p-3">Check-in</th><th className="p-3">Check-out</th><th className="p-3">Status</th></tr></thead>
          <tbody>{mine.slice().reverse().map(a=>(
            <tr key={a.id} className="border-t" style={{borderColor:coffee[100]}}>
              <td className="p-3">{a.date}</td><td className="p-3">{a.checkIn}</td><td className="p-3">{a.checkOut}</td><td className="p-3"><Badge status={a.status} /></td>
            </tr>))}</tbody>
        </table>
      </Card>
    </div>
  );
}

function ApplyLeavePage({ user, leaves, addLeave }) {
  const [type,setType]=useState("Paid"); const [from,setFrom]=useState(""); const [to,setTo]=useState(""); const [remarks,setRemarks]=useState("");
  const mine = leaves.filter(l=>l.empId===user.empId);
  const submit = (e) => { e.preventDefault(); if(!from||!to) return; addLeave({ id: Date.now(), empId:user.empId, name:user.name, type, from, to, remarks, status:"Pending" }); setFrom("");setTo("");setRemarks(""); };
  return (
    <div>
      <SectionTitle title="Leave Requests" desc="Apply for leave and track approval status." />
      <div className="grid md:grid-cols-2 gap-6">
        <Card className="p-6" pop={false}>
          <p className="font-display font-bold mb-4" style={{color:coffee[900]}}>Apply for Leave</p>
          <form onSubmit={submit} className="space-y-3">
            <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Leave Type</label><Select options={["Paid","Sick","Unpaid"]} value={type} onChange={e=>setType(e.target.value)} /></div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>From</label><Input type="date" value={from} onChange={e=>setFrom(e.target.value)} required /></div>
              <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>To</label><Input type="date" value={to} onChange={e=>setTo(e.target.value)} required /></div>
            </div>
            <div><label className="text-xs font-semibold" style={{color:coffee[600]}}>Remarks</label><Input value={remarks} onChange={e=>setRemarks(e.target.value)} placeholder="Reason (optional)" /></div>
            <Button type="submit" className="w-full">Submit Request</Button>
          </form>
        </Card>
        <Card className="p-0 overflow-hidden h-fit" pop={false}>
          <p className="font-display font-bold p-4 pb-0" style={{color:coffee[900]}}>My Requests</p>
          <table className="w-full text-sm mt-3">
            <thead style={{background:coffee[50], color:coffee[500]}} className="text-left"><tr><th className="p-3">Type</th><th className="p-3">Dates</th><th className="p-3">Status</th></tr></thead>
            <tbody>{mine.slice().reverse().map(l=>(<tr key={l.id} className="border-t" style={{borderColor:coffee[100]}}><td className="p-3">{l.type}</td><td className="p-3">{l.from} → {l.to}</td><td className="p-3"><Badge status={l.status} /></td></tr>))}</tbody>
          </table>
        </Card>
      </div>
    </div>
  );
}

function PayrollView({ employee }) {
  return (
    <div>
      <SectionTitle title="Payroll" desc="Your salary details (read-only)." />
      <Card className="p-6 max-w-md" pop={false}>
        <div className="space-y-3 text-sm">
          <div className="flex justify-between"><span style={{color:coffee[500]}}>Base Salary</span><span className="font-semibold" style={{color:coffee[900]}}>₹{employee.salary.toLocaleString()}</span></div>
          <div className="flex justify-between"><span style={{color:coffee[500]}}>Department</span><span style={{color:coffee[800]}}>{employee.dept}</span></div>
          <div className="flex justify-between"><span style={{color:coffee[500]}}>Designation</span><span style={{color:coffee[800]}}>{employee.designation}</span></div>
          <div className="border-t pt-3 flex justify-between font-semibold" style={{borderColor:coffee[100], color:coffee[900]}}><span>Net Pay (monthly)</span><span>₹{employee.salary.toLocaleString()}</span></div>
        </div>
      </Card>
    </div>
  );
}

/* ---------------- ADMIN PAGES ---------------- */
function AdminDashboard({ employees, leaves, attendance }) {
  const pending = leaves.filter(l=>l.status==="Pending").length;
  const presentToday = attendance.filter(a=>a.status==="Present").length;
  return (
    <div>
      <SectionTitle title="Admin Overview" desc="Snapshot of your organization today." />
      <div className="grid grid-cols-3 gap-4 mb-6">
        <Card className="p-5"><p className="text-xs" style={{color:coffee[400]}}>Total Employees</p><p className="font-display text-3xl font-bold" style={{color:coffee[900]}}>{employees.length}</p></Card>
        <Card className="p-5"><p className="text-xs" style={{color:coffee[400]}}>Pending Leave Approvals</p><p className="font-display text-3xl font-bold text-amber-600">{pending}</p></Card>
        <Card className="p-5"><p className="text-xs" style={{color:coffee[400]}}>Present Records Logged</p><p className="font-display text-3xl font-bold text-emerald-600">{presentToday}</p></Card>
      </div>
      <Card className="p-0 overflow-hidden" pop={false}>
        <p className="font-display font-bold p-4 pb-0" style={{color:coffee[900]}}>Employees</p>
        <table className="w-full text-sm mt-3">
          <thead style={{background:coffee[50], color:coffee[500]}} className="text-left"><tr><th className="p-3">Name</th><th className="p-3">ID</th><th className="p-3">Dept</th><th className="p-3">Designation</th></tr></thead>
          <tbody>{employees.map(e=>(<tr key={e.id} className="border-t" style={{borderColor:coffee[100]}}><td className="p-3">{e.name}</td><td className="p-3">{e.id}</td><td className="p-3">{e.dept}</td><td className="p-3">{e.designation}</td></tr>))}</tbody>
        </table>
      </Card>
    </div>
  );
}

function AdminAttendance({ attendance, employees }) {
  const nameOf = (id) => employees.find(e=>e.id===id)?.name || id;
  return (
    <div>
      <SectionTitle title="Attendance Records" desc="View attendance across all employees." />
      <Card className="p-0 overflow-hidden" pop={false}>
        <table className="w-full text-sm">
          <thead style={{background:coffee[50], color:coffee[500]}} className="text-left"><tr><th className="p-3">Employee</th><th className="p-3">Date</th><th className="p-3">Check-in</th><th className="p-3">Check-out</th><th className="p-3">Status</th></tr></thead>
          <tbody>{attendance.slice().reverse().map(a=>(<tr key={a.id} className="border-t" style={{borderColor:coffee[100]}}><td className="p-3">{nameOf(a.empId)}</td><td className="p-3">{a.date}</td><td className="p-3">{a.checkIn}</td><td className="p-3">{a.checkOut}</td><td className="p-3"><Badge status={a.status} /></td></tr>))}</tbody>
        </table>
      </Card>
    </div>
  );
}

function AdminLeaveApproval({ leaves, setLeaves }) {
  const setStatus = (id,status) => setLeaves(leaves.map(l=>l.id===id?{...l,status}:l));
  return (
    <div>
      <SectionTitle title="Leave Approvals" desc="Approve or reject employee leave requests." />
      <Card className="p-0 overflow-hidden" pop={false}>
        <table className="w-full text-sm">
          <thead style={{background:coffee[50], color:coffee[500]}} className="text-left"><tr><th className="p-3">Employee</th><th className="p-3">Type</th><th className="p-3">Dates</th><th className="p-3">Remarks</th><th className="p-3">Status</th><th className="p-3">Action</th></tr></thead>
          <tbody>{leaves.map(l=>(
            <tr key={l.id} className="border-t" style={{borderColor:coffee[100]}}>
              <td className="p-3">{l.name}</td><td className="p-3">{l.type}</td><td className="p-3">{l.from} → {l.to}</td>
              <td className="p-3" style={{color:coffee[500]}}>{l.remarks||"-"}</td><td className="p-3"><Badge status={l.status} /></td>
              <td className="p-3">{l.status==="Pending" ? <div className="flex gap-2"><Button variant="success" onClick={()=>setStatus(l.id,"Approved")}>Approve</Button><Button variant="danger" onClick={()=>setStatus(l.id,"Rejected")}>Reject</Button></div> : <span className="text-xs" style={{color:coffee[400]}}>Reviewed</span>}</td>
            </tr>))}</tbody>
        </table>
      </Card>
    </div>
  );
}

function AdminPayroll({ employees, updateEmployee }) {
  const [editingId,setEditingId]=useState(null); const [value,setValue]=useState("");
  return (
    <div>
      <SectionTitle title="Payroll Control" desc="View and update salary structure for employees." />
      <Card className="p-0 overflow-hidden" pop={false}>
        <table className="w-full text-sm">
          <thead style={{background:coffee[50], color:coffee[500]}} className="text-left"><tr><th className="p-3">Name</th><th className="p-3">ID</th><th className="p-3">Salary</th><th className="p-3">Action</th></tr></thead>
          <tbody>{employees.map(e=>(
            <tr key={e.id} className="border-t" style={{borderColor:coffee[100]}}>
              <td className="p-3">{e.name}</td><td className="p-3">{e.id}</td>
              <td className="p-3">{editingId===e.id ? <Input type="number" value={value} onChange={ev=>setValue(ev.target.value)} className="w-32" /> : `₹${e.salary.toLocaleString()}`}</td>
              <td className="p-3">{editingId===e.id ? <div className="flex gap-2"><Button variant="success" onClick={()=>{updateEmployee({...e,salary:Number(value)});setEditingId(null);}}>Save</Button><Button variant="ghost" onClick={()=>setEditingId(null)}>Cancel</Button></div> : <Button variant="ghost" onClick={()=>{setEditingId(e.id);setValue(e.salary);}}>Update</Button>}</td>
            </tr>))}</tbody>
        </table>
      </Card>
    </div>
  );
}

/* ---------------- ROOT ---------------- */
function App() {
  const [screen,setScreen]=useState("signin");
  const [user,setUser]=useState(null);
  const [active,setActive]=useState("dashboard");
  const [users,setUsers]=useState(seedUsers);
  const [employees,setEmployees]=useState(seedEmployees);
  const [attendance,setAttendance]=useState(seedAttendance);
  const [leaves,setLeaves]=useState(seedLeaves);

  const updateEmployee = (updated) => setEmployees(employees.map(e=>e.id===updated.id?updated:e));
  const addAttendance = (rec) => setAttendance([...attendance, rec]);
  const addLeave = (rec) => setLeaves([...leaves, rec]);
  const handleRegister = (newUser) => {
    setUsers([...users, newUser]);
    if (newUser.role === "Employee" && !employees.some(e=>e.id===newUser.empId)) {
      setEmployees([...employees, { id:newUser.empId, name:newUser.name, email:newUser.email, designation:"New Hire", dept:"Unassigned", phone:"", address:"", salary:0, joined:new Date().toISOString().slice(0,10) }]);
    }
  };

  if (!user) {
    return screen==="signin"
      ? <SignIn users={users} onLogin={(u)=>{setUser(u);setActive("dashboard");}} goSignUp={()=>setScreen("signup")} />
      : <SignUp users={users} onRegister={handleRegister} goSignIn={()=>setScreen("signin")} />;
  }

  const logout = () => { setUser(null); setScreen("signin"); };

  if (user.role === "Employee") {
    const employee = employees.find(e=>e.id===user.empId) || employees[0];
    const myLeaves = leaves.filter(l=>l.empId===user.empId);
    const tabs = [{key:"dashboard",label:"Dashboard"},{key:"profile",label:"Profile"},{key:"attendance",label:"Attendance"},{key:"leave",label:"Leave Requests"},{key:"payroll",label:"Payroll"}];
    return (
      <Shell user={user} onLogout={logout} active={active} setActive={setActive} tabs={tabs}>
        {active==="dashboard" && <EmployeeDashboard user={user} setActive={setActive} myLeaves={myLeaves} />}
        {active==="profile" && <ProfilePage employee={employee} updateEmployee={updateEmployee} />}
        {active==="attendance" && <AttendancePage empId={user.empId} attendance={attendance} addAttendance={addAttendance} />}
        {active==="leave" && <ApplyLeavePage user={user} leaves={leaves} addLeave={addLeave} />}
        {active==="payroll" && <PayrollView employee={employee} />}
      </Shell>
    );
  }

  const tabs = [{key:"dashboard",label:"Dashboard"},{key:"attendance",label:"Attendance"},{key:"leave",label:"Leave Approvals"},{key:"payroll",label:"Payroll Control"}];
  return (
    <Shell user={user} onLogout={logout} active={active} setActive={setActive} tabs={tabs}>
      {active==="dashboard" && <AdminDashboard employees={employees} leaves={leaves} attendance={attendance} />}
      {active==="attendance" && <AdminAttendance attendance={attendance} employees={employees} />}
      {active==="leave" && <AdminLeaveApproval leaves={leaves} setLeaves={setLeaves} />}
      {active==="payroll" && <AdminPayroll employees={employees} updateEmployee={updateEmployee} />}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
